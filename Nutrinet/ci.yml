name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  lint:
    name: PHP Syntax Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["7.4", "8.1"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo, pdo_mysql, gd, curl
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          error=0
          while IFS= read -r -d '' file; do
            php -l "$file" || error=1
          done < <(find . -type f -name "*.php" -print0)
          exit $error

  composer:
    name: Composer Validate & Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: none

      - name: Validate composer.json (if present)
        run: |
          if [ -f composer.json ]; then
            composer validate --no-check-publish
          else
            echo "No composer.json found, skipping validation."
          fi

      - name: Install dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress --no-interaction
          else
            echo "No composer.json found, skipping install."
          fi

  database:
    name: Database Schema Check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: projet
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot && break
            sleep 2
          done

      - name: Import schema
        run: |
          if [ -f projet.sql ]; then
            mysql -h 127.0.0.1 -P 3306 -uroot -proot projet < projet.sql
            echo "Schema imported successfully."
          else
            echo "projet.sql not found, skipping import."
            exit 1
          fi

      - name: Verify tables exist
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot projet -e "SHOW TABLES;"

